services:
  api:
    build:
      context: ./api
      dockerfile: docker/Dockerfile
    image: atlas-api:local
    container_name: atlas_api
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./api:/var/www/html
      - api_vendor:/var/www/html/vendor
      - api_node_modules:/var/www/html/node_modules
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8000}
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:3000,127.0.0.1,127.0.0.1:3000}
      SESSION_COOKIE: atlas_session
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-atlas}
      DB_USERNAME: ${DB_USERNAME:-atlas}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: redis
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_EGRESS_BUCKET: ${LIVEKIT_EGRESS_BUCKET:-atlas-recordings}
      LIVEKIT_EGRESS_S3_KEY: ${LIVEKIT_EGRESS_S3_KEY:-minioadmin}
      LIVEKIT_EGRESS_S3_SECRET: ${LIVEKIT_EGRESS_S3_SECRET:-minioadmin}
      LIVEKIT_EGRESS_S3_REGION: ${LIVEKIT_EGRESS_S3_REGION:-us-east-1}
      LIVEKIT_EGRESS_S3_ENDPOINT: ${LIVEKIT_EGRESS_S3_ENDPOINT:-http://minio:9000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: atlas_postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-atlas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_DATABASE:-atlas}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: atlas_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: atlas_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  minio:
    image: minio/minio:latest
    container_name: atlas_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  api_vendor:
  api_node_modules:
  minio_data:
